name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Audit must stay clean on the good fixture
        run: |
          python skills/apple-liquid-glass/scripts/audit_liquid_glass.py \
            tests/fixtures/GoodGlass.swift \
            --min-confidence medium --json > /tmp/good.json
          python - <<'PY'
          import json, sys
          findings = json.load(open("/tmp/good.json"))["findings"]
          if findings:
              print("False positives on known-good code:")
              for f in findings:
                  print(f"  {f['check']} at line {f['line']}")
              sys.exit(1)
          print("Good fixture clean.")
          PY
